name: Build and deploy to GitHub Pages to be online

on:
  # Deployments are manual (Actions > Run workflow), so the deployment history
  # only lists releases someone chose to publish. Pull requests still run the build.
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx ng build --configuration production --base-href /optimal/
      # SPA fallback: GitHub Pages serves 404.html for unknown paths (deep links, refresh)
      - run: cp dist/optimal/browser/index.html dist/optimal/browser/404.html
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist/optimal/browser

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
