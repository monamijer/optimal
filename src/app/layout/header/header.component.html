<header class="navbar navbar-expand-lg border-bottom px-3 px-lg-4">

  <!-- Toggle sidebar mobile -->
  <button
    class="btn btn-outline-secondary d-lg-none me-3"
    (click)="toggleSidebar()"
    aria-label="Toggle navigation">
    <i class="bi bi-list"></i>
  </button>

  <!-- Brand -->
  <a class="navbar-brand fw-bold" routerLink="/">
    <span class="brand-dot">./</span>Optimal
  </a>

  <div class="flex-grow-1"></div>

  <!-- Search desktop -->
  <div class="d-none d-lg-block me-3" style="width: 240px;">
    <input
      type="search"
      class="form-control form-control-sm"
      placeholder="Rechercher..."
      aria-label="Search">
  </div>

  <!-- Auth links (si non connecté) -->
  @if (!auth.isLoggedIn()) {
    <div class="d-none d-md-flex align-items-center gap-2 me-2">
      <a routerLink="/login" class="btn btn-sm btn-outline-secondary">
        Se connecter
      </a>
      <a routerLink="/register" class="btn btn-sm btn-primary">
        S'inscrire
      </a>
    </div>
  } @else {
    <!-- Utilisateur connecté -->
    <div class="d-none d-md-flex align-items-center gap-2 me-2">
      <span class="user-pill">
        <i class="bi bi-person-circle me-1"></i>
        {{ auth.user()?.name }}
      </span>
      <button class="btn btn-sm btn-outline-danger" (click)="logout()">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>
  }

  <!-- Dark mode toggle -->
  <button
    class="btn btn-outline-secondary btn-sm"
    (click)="toggleTheme()"
    aria-label="Toggle dark mode">
    <i class="bi"
       [class.bi-moon-stars]="theme.theme() === 'light'"
       [class.bi-sun]="theme.theme() === 'dark'"></i>
  </button>

</header>
