<header class="site-header">
  <div class="site-header-inner">

    <button
      type="button"
      class="menu-btn"
      (click)="toggleSidebar()"
      [attr.aria-expanded]="layoutService.sidebarOpen()"
      aria-controls="app-sidebar">
      <i class="bi bi-list" aria-hidden="true"></i>
      <span class="menu-label">Menu</span>
    </button>

    <a class="brand" routerLink="/" aria-label="Optimal, accueil">
      <span class="brand-word">optimal</span>
    </a>

    <button type="button" class="search" (click)="searchService.open()" aria-label="Rechercher dans les cours" aria-keyshortcuts="/ Control+K">
      <i class="bi bi-search" aria-hidden="true"></i>
      <span class="search-text">Rechercher un cours ou un sujet</span>
      <kbd class="search-key" aria-hidden="true">/</kbd>
    </button>

    <nav class="top-links" aria-label="Principal">
      <a routerLink="/courses" routerLinkActive="on">Cours</a>
    </nav>

    <button type="button" class="icon-btn" (click)="toggleTheme()"
      [attr.aria-label]="theme.theme() === 'light' ? 'Activer le mode sombre' : 'Activer le mode clair'">
      <i class="bi" [class.bi-moon-stars]="theme.theme() === 'light'" [class.bi-sun]="theme.theme() === 'dark'" aria-hidden="true"></i>
    </button>

    @if (!auth.isLoggedIn()) {
      <a routerLink="/login" class="account-link">Se connecter</a>
    } @else {
      <span class="user-pill" [title]="auth.user()?.name">
        <i class="bi bi-person-circle" aria-hidden="true"></i>
        <span>{{ auth.user()?.name }}</span>
      </span>
      <button type="button" class="icon-btn" (click)="logout()" aria-label="Se déconnecter">
        <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
      </button>
    }
  </div>
</header>
