<h2> Sign In</h2>
<form (ngSubmit)='register()' [formGroup]='userForm' >
  <div>
    <label for="username">Username: </label>
    <input [formControl]="username" id="username" />
  </div>
  <div>
    <label for="password">Password </label>
    <input type="password" [formControl]="password" />
  </div>
  <div>
    <label for="confirmPassword" [formControl]="confirmPassword">Confirm password </label>
    <input type="password" [formControl]="confirmPassword">
  </div>
  <div>
    <button type="submit">Register</button>
  </div>
</form>
