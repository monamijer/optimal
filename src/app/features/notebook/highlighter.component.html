@if (draft(); as d) {
  <div class="hl-pop" role="toolbar" [attr.aria-label]="'hl.aria' | t" [style.top.px]="d.top" [style.left.px]="d.left"
       (mousedown)="$event.preventDefault()">
    @if (d.mode === 'new') {
      <button type="button" (click)="save(false)" aria-keyshortcuts="Alt+H"><i class="bi bi-highlighter" aria-hidden="true"></i> {{ 'hl.highlight' | t }}</button>
      <button type="button" (click)="openNote()"><i class="bi bi-pencil-square" aria-hidden="true"></i> {{ 'hl.note' | t }}</button>
    } @else {
      <form (submit)="$event.preventDefault(); save(true)" (mousedown)="$event.stopPropagation()">
        <label class="visually-hidden" for="hl-note">{{ 'hl.noteLabel' | t }}</label>
        <textarea id="hl-note" rows="3" maxlength="1000" [placeholder]="'hl.placeholder' | t"
          [value]="d.note" (input)="setNote($any($event.target).value)" (keydown.control.enter)="save(true)"></textarea>
        <div class="row">
          <button type="submit" class="primary">{{ 'hl.save' | t }}</button>
          @if (d.mode === 'edit') { <button type="button" class="danger" (click)="remove()">{{ 'nb.remove' | t }}</button> }
          <button type="button" (click)="draft.set(null)">{{ 'hl.close' | t }}</button>
        </div>
      </form>
    }
  </div>
}
