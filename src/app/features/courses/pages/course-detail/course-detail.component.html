@if (readingProgress() > 0) {
  <div class="reading-progress">
    <div class="reading-progress-bar" [style.width.%]="readingProgress()"></div>
  </div>
}

<!-- ✅ Layout centré comme MDN -->
<div class="course-page">
  @if (!(content$ | async)) {
    <div class="course-main">
      <div class="skeleton-wrapper">
        <div class="skeleton-title"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line short"></div>
      </div>
    </div>
  } @else {
    <main class="course-main">
      @for (section of filteredSections$ | async; track section.id) {
        <app-course-section [section]="section" />
      }
    </main>

    <aside class="course-toc doc-toc">
      <p class="text-uppercase text-muted small fw-semibold mb-2">Sur cette page</p>
      <ul class="nav flex-column">
        @for (heading of headings$ | async; track heading.id) {
          <li
            [class.active]="scrollSpy.activeId() === heading.id"
            [style.padding-left.px]="heading.level === 3 ? 16 : 0"
          >
            <a [routerLink]="[]" [fragment]="heading.id">
              {{ heading.text }}
            </a>
          </li>
        }
      </ul>
    </aside>
  }
</div>
