<div class="auth-page">
  <div class="auth-grid"></div>
  <div class="auth-glow"></div>

  <div class="auth-card">

    <!-- Logo / Brand -->
    <div class="auth-brand">
      <a routerLink="/" class="brand-link">
        <span class="brand-prefix"></span>Universite
      </a>
    </div>

    <div class="auth-header">
      <div class="auth-tag"></div>
      <h1 class="auth-title">Connexion</h1>
      <p class="auth-sub">Accédez à votre compte.</p>
    </div>

    <!-- Error -->
    @if (error()) {
      <div class="auth-alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error() }}
      </div>
    }

    <!-- Forms -->
    <form [formGroup]="userForm" (ngSubmit)="login()" class="auth-form" novalidate>

      <div class="field-group">
        <label class="field-label" for="email">Email</label>
        <div class="field-wrap">
          <i class="bi bi-envelope field-icon"></i>
          <input
            id="email"
            type="email"
            class="field-input"
            formControlName="email"
            placeholder=""
            autocomplete="email"
            [class.field-error]="userForm.get('email')?.invalid && userForm.get('email')?.touched"
          />
        </div>
        @if (userForm.get('email')?.invalid && userForm.get('email')?.touched) {
          <span class="field-msg">Email invalide.</span>
        }
      </div>

      <div class="field-group">
        <div class="d-flex justify-content-between">
          <label class="field-label" for="password">Mot de passe</label>
        </div>
        <div class="field-wrap">
          <i class="bi bi-lock field-icon"></i>
          <input
            id="password"
            type="password"
            class="field-input"
            formControlName="password"
            placeholder=""
            autocomplete="current-password"
            [class.field-error]="userForm.get('password')?.invalid && userForm.get('password')?.touched"
          />
        </div>
      </div>

      

      <button type="submit" class="auth-btn" [disabled]="userForm.invalid">
        <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
      </button>

    </form>

    <p class="auth-switch">
      Pas encore de compte ?
      <a routerLink="/register" class="auth-link">S'inscrire gratuitement</a>
    </p>

  </div>
</div>
