<div class="nf-page">
  <div class="nf-grid"></div>
  <div class="nf-glow"></div>

  <div class="nf-inner">

    <div class="nf-code">404</div>

    <!-- Animated terminal -->

    <div class="terminal">
      <div class="terminal-bar">
        <span class="t-dot t-red"></span>
        <span class="t-dot t-yellow"></span>
        <span class="t-dot t-green"></span>
        <span class="t-title">bash — university</span>
      </div>
      <div class="terminal-body">
        @for (line of lines; track $index) {
          <div class="t-line" [class.t-cmd]="line.startsWith('$')"
               [class.t-err]="line.includes('timeout') || line.includes('404') || line.includes('Error')">
            {{ line }}&nbsp;
          </div>
        }
        <span class="cursor">█</span>
      </div>
    </div>

    <h1 class="nf-title">Page introuvable.</h1>
    <p class="nf-sub">La route que vous cherchez n'existe pas ou a été déplacée.</p>

    <div class="nf-actions">
      <a routerLink="/" class="nf-btn-primary">
        <i class="bi bi-house-fill me-2"></i>Retour à l'accueil
      </a>
      <a routerLink="/courses" class="nf-btn-secondary">
        <i class="bi bi-journal-code me-2"></i>Voir les cours
      </a>
    </div>

  </div>
</div>
